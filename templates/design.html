<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bracelet Color Studio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/2.4.2/chroma.min.js"></script>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <style>
        :root {
            --bg: #0b0f1a;
            --panel: #161b2a;
            --panel-light: #1f263d;
            --accent: #60a5fa;
            --border: #2d334a;
            --text-dim: #94a3b8;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: #fff;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        header {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            width: 100%;
        }

        h2 {
            font-size: 1.1rem;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #controls {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
            padding: 15px;
            background: var(--panel);
            border-radius: 16px;
            border: 1px solid var(--border);
            position: relative;
        }

        /* ── Drag & Drop Logic ── */
        .color-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--panel-light);
            padding: 16px 10px;
            border-radius: 12px;
            border: 1px solid var(--border);
            position: relative;
            transition: box-shadow 0.15s, border-color 0.15s, opacity 0.15s, transform 0.15s;
            cursor: grab;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-overflow-scrolling: auto;
            touch-action: none !important;
        }

        .color-group:active {
            cursor: grabbing;
        }

        /* Source card dims while dragging */
        .color-group.is-placeholder {
            opacity: 0.2;
            border-style: dashed;
            border-color: var(--accent);
        }

        /* Target card glows */
        .color-group.drag-over {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent);
            transform: scale(1.04);
        }

        /* Ghost element follows pointer */
        #drag-ghost {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 10px 14px;
            border-radius: 12px;
            border: 2px solid var(--accent);
            background: var(--panel-light);
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.7);
            opacity: 0.93;
        }

        #drag-ghost .ghost-swatch {
            width: 38px;
            height: 38px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        #drag-ghost .ghost-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
        }

        /* ── Form Elements ── */
        label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            text-align: center;
            pointer-events: none;
            /* Let clicks pass to the card for dragging */
        }

        .input-row {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        input[type="color"] {
            flex-shrink: 0;
            width: 32px;
            height: 32px;
            border: none;
            cursor: pointer;
            background: none;
        }

        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        input[type="color"]::-webkit-color-swatch {
            border: 1px solid var(--border);
            border-radius: 6px;
        }

        input[type="text"] {
            width: 100%;
            background: #0b0f1a;
            border: 1px solid var(--border);
            color: #fff;
            padding: 5px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 11px;
            text-align: center;
            outline: none;
            cursor: text;
            user-select: text;
            /* Allow text interaction inside the box */
        }

        .btn-primary {
            background: var(--accent);
            color: #0b0f1a;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            text-transform: uppercase;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn-secondary {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            text-transform: uppercase;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            font-family: inherit;
        }

        .btn-secondary:hover {
            background: rgba(96, 165, 250, 0.1);
        }

        /* ── Preview Area ── */
        .preview-area {
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            border-radius: 24px;
            border: 1px solid var(--border);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 500px;
            overflow: hidden;
            box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.7);
        }

        .preview-bar-wrapper {
            width: 100%;
            height: 90px;
            margin-bottom: 30px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .preview-bar-wrapper svg {
            height: 80% !important;
            width: auto !important;
        }

        .main-design-wrapper svg {
            width: 100% !important;
            max-width: 550px;
            height: auto !important;
        }

        .editor-tools {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-bottom: 10px;
        }

        .tool-btn {
            background: transparent;
            color: var(--text-dim);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 0.75rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
        }

        .tool-btn:hover:not(:disabled),
        .tool-btn:focus-visible {
            color: #fff;
            border-color: var(--accent);
            outline: none;
        }

        .tool-btn:disabled {
            opacity: 0.35;
            cursor: default;
        }

        .preview-bar-wrapper {
            cursor: zoom-in;
        }

        .zoom-hint {
            position: absolute;
            right: 8px;
            bottom: 6px;
            font-size: 14px;
            color: var(--text-dim);
            pointer-events: none;
        }

        .lightbox {
            position: fixed;
            inset: 0;
            z-index: 10000;
            background: rgba(5, 8, 15, 0.92);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: zoom-out;
        }

        .lightbox[hidden] {
            display: none;
        }

        .lightbox img {
            width: 94vw;
            max-height: 90vh;
            object-fit: contain;
        }

        /* On a tall phone screen, turn the bracelet sideways so it fills the height */
        @media (orientation: portrait) and (max-width: 700px) {
            .lightbox img.rotate {
                width: 90vh;
                max-height: 90vw;
                transform: rotate(90deg);
            }
        }

        .lightbox-close {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--panel);
            color: #fff;
            font-size: 24px;
            line-height: 1;
            cursor: pointer;
        }

        .floss-code {
            font-size: 0.7rem;
            color: var(--text-dim);
            opacity: 0.8;
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column;
                gap: 15px;
            }

            #controls {
                grid-template-columns: 1fr 1fr;
            }

            .preview-bar-wrapper {
                height: 80px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <h2>Pattern Editor</h2>
            <div class="header-actions">
                <a class="btn-secondary" href="{{ url_for('index') }}">Change Design</a>
                <button class="btn-secondary" id="copyLinkBtn" type="button">Copy Link</button>
                <button class="btn-primary" id="smartPaletteBtn" type="button">Smart Palette</button>
            </div>
        </header>

        <div class="editor-tools">
            <button class="tool-btn" id="undoBtn" type="button" disabled title="Undo (Ctrl+Z)">&#8630; Undo</button>
            <button class="tool-btn" id="resetBtn" type="button" title="Go back to the pattern's original colors">Reset colors</button>
        </div>

        <div id="controls"></div>

        <div class="preview-area" id="svgPreview">
            {% if pattern %}
            {% if preview %}<div class="preview-bar-wrapper" id="previewBar" role="button" tabindex="0"
                title="Tap to enlarge" aria-label="Enlarge bracelet preview">{{ preview|safe }}<span class="zoom-hint" aria-hidden="true">&#x2922;</span></div>{% endif %}
            <div class="main-design-wrapper">{{ pattern|safe }}</div>
            {% else %}
            <p style="color: var(--text-dim);">No design loaded.</p>
            {% endif %}
        </div>
    </div>

    <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Bracelet preview">
        <img id="lightboxImg" alt="Bracelet preview, enlarged">
        <button class="lightbox-close" id="lightboxClose" type="button" aria-label="Close">&times;</button>
    </div>

    <div id="drag-ghost">
        <div class="ghost-swatch" id="ghost-swatch"></div>
        <div class="ghost-label" id="ghost-label"></div>
    </div>

    <script>
        const COLOR_SUFFIXES = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h', 'i', 'j', 'k', 'l', 'm', 'n', 'o', 'p'];
        // Color letters this design actually draws with, in order (filled in by processSVG)
        let designSuffixes = [];
        // The pattern's own colors, by color letter, for Reset
        const originalColors = {};
        // Undo history: earlier hex_codes strings, newest last
        const undoStack = [];
        let lastCommitted = '';
        const DESIGN_NUMBER = {{ design_number | tojson }};
        const BASE_PATH = {{ base_path | tojson }};
        const INCOMING_HEX_CODES = {{ hex_codes | tojson }};
        const DMC = {{ dmc_colors | tojson }};
        const DMC_HEXES = Object.keys(DMC);

        const controls = document.getElementById('controls');
        const ghost = document.getElementById('drag-ghost');
        const ghostSwatch = document.getElementById('ghost-swatch');
        const ghostLabel = document.getElementById('ghost-label');

        let drag = {
            active: false,
            srcEl: null,
            overEl: null,
            startX: 0,
            startY: 0,
            offsetX: 0,
            offsetY: 0,
        };

        // ── Helpers ──────────────────────────────────────────────
        function getCards() {
            return [...controls.querySelectorAll('.color-group')];
        }

        function nearestDmc(hex) {
            const key = hex.toLowerCase();
            if (DMC[key]) return { code: DMC[key], exact: true };
            let best = null, bestDist = Infinity;
            DMC_HEXES.forEach(h => {
                const d = chroma.deltaE(key, h);
                if (d < bestDist) { bestDist = d; best = h; }
            });
            return { code: DMC[best], exact: false };
        }

        function currentHexCodes() {
            // One code per design color, in color-letter order (A, B, C...)
            const bySuffix = {};
            getCards().forEach(card => {
                bySuffix[card.dataset.suffix] = card.querySelector('input[type="color"]').value.replace('#', '');
            });
            return designSuffixes.map(s => bySuffix[s]).join(',');
        }

        function editorUrl() {
            return `${BASE_PATH}?hex_codes=${currentHexCodes()}`;
        }

        // Keep the URL in step with the colors so refresh, Back and shared links keep edits
        function syncUrl() {
            const codes = currentHexCodes();
            if (lastCommitted && codes !== lastCommitted) {
                undoStack.push(lastCommitted);
                if (undoStack.length > 100) undoStack.shift();
            }
            lastCommitted = codes;
            document.getElementById('undoBtn').disabled = undoStack.length === 0;
            history.replaceState(null, '', editorUrl());
            saveRecent();
        }

        // Remember this design (and its colors) for the home page's Recent list
        function saveRecent() {
            try {
                const list = JSON.parse(localStorage.getItem('recentDesigns') || '[]')
                    .filter(item => item && item.path !== BASE_PATH);
                list.unshift({ path: BASE_PATH, hexCodes: currentHexCodes(), at: Date.now() });
                localStorage.setItem('recentDesigns', JSON.stringify(list.slice(0, 6)));
            } catch (e) { /* storage unavailable: skip */ }
        }

        // Set every card's color from a hex_codes string, in card order
        function applyCodes(codes) {
            const list = codes.split(',');
            getCards().forEach((card, i) => {
                if (list[i]) setCardColor(card, '#' + list[i]);
            });
        }

        function undo() {
            if (!undoStack.length) return;
            lastCommitted = undoStack.pop();
            applyCodes(lastCommitted);
            document.getElementById('undoBtn').disabled = undoStack.length === 0;
            history.replaceState(null, '', editorUrl());
            saveRecent();
        }

        function resetColors() {
            getCards().forEach((card, i) => setCardColor(card, originalColors[designSuffixes[i]]));
            syncUrl();
        }

        function updateCardLabel(card) {
            const suffix = card.dataset.suffix.toUpperCase();
            card.querySelector('.color-name').textContent = `Color ${suffix}`;
        }

        function updateFloss(card, color) {
            const span = card.querySelector('.floss-code');
            const { code, exact } = nearestDmc(color);
            span.textContent = `${exact ? '' : '≈ '}DMC ${code}`;
            span.title = exact ? 'Exact DMC floss match' : 'Closest DMC floss color';
        }

        function setCardColor(card, color, { fromText = false } = {}) {
            const picker = card.querySelector('input[type="color"]');
            const textField = card.querySelector('input[type="text"]');
            picker.value = color;
            if (!fromText) textField.value = color.toUpperCase();
            updateSVGColors(card.dataset.suffix, color);
            updateFloss(card, color);
        }

        // ── Drag to swap ─────────────────────────────────────────
        function initDrag(card) {
            card.addEventListener('pointerdown', (e) => {
                // Let inputs and buttons inside the card work normally
                if (e.target.closest('input, button')) return;
                if (e.button !== 0 && e.button !== undefined) return;

                e.preventDefault();

                drag.srcEl = card;
                drag.startX = e.clientX;
                drag.startY = e.clientY;
                drag.active = false;

                card.setPointerCapture(e.pointerId);
                card.addEventListener('pointermove', onMove);
                card.addEventListener('pointerup', onUp);
                card.addEventListener('pointercancel', onUp);
            });
        }

        function onMove(e) {
            const dx = e.clientX - drag.startX;
            const dy = e.clientY - drag.startY;

            if (!drag.active) {
                if (Math.hypot(dx, dy) < 8) return;

                // Start drag: Blur keyboard if open
                if (document.activeElement) document.activeElement.blur();

                drag.active = true;
                const rect = drag.srcEl.getBoundingClientRect();
                drag.offsetX = drag.startX - rect.left;
                drag.offsetY = drag.startY - rect.top;

                const picker = drag.srcEl.querySelector('input[type="color"]');
                ghostSwatch.style.background = picker ? picker.value : '#888';
                ghostLabel.textContent = 'Color ' + (drag.srcEl.dataset.suffix || '').toUpperCase();
                ghost.style.width = rect.width + 'px';
                ghost.style.display = 'flex';

                drag.srcEl.classList.add('is-placeholder');
                document.body.style.overflow = 'hidden';
            }

            ghost.style.left = (e.clientX - drag.offsetX) + 'px';
            ghost.style.top = (e.clientY - drag.offsetY) + 'px';

            ghost.style.display = 'none';
            const elBelow = document.elementFromPoint(e.clientX, e.clientY);
            ghost.style.display = 'flex';

            const targetCard = elBelow ? elBelow.closest('.color-group') : null;

            if (drag.overEl && drag.overEl !== targetCard) {
                drag.overEl.classList.remove('drag-over');
            }
            if (targetCard && targetCard !== drag.srcEl) {
                targetCard.classList.add('drag-over');
                drag.overEl = targetCard;
            } else {
                drag.overEl = null;
            }
        }

        function onUp(e) {
            const card = e.currentTarget;
            card.removeEventListener('pointermove', onMove);
            card.removeEventListener('pointerup', onUp);
            card.removeEventListener('pointercancel', onUp);

            ghost.style.display = 'none';
            document.body.style.overflow = '';
            if (drag.srcEl) drag.srcEl.classList.remove('is-placeholder');
            if (drag.overEl) drag.overEl.classList.remove('drag-over');

            if (drag.active && drag.overEl && drag.overEl !== drag.srcEl) {
                swapCards(drag.srcEl, drag.overEl);
            }

            drag.active = false;
            drag.srcEl = null;
            drag.overEl = null;
        }

        function swapCards(a, b) {
            const marker = document.createComment('');
            a.replaceWith(marker);
            b.replaceWith(a);
            marker.replaceWith(b);
            rebindAllSuffixes();
        }

        // After a swap, each card takes the color letter of its new position
        function rebindAllSuffixes() {
            getCards().forEach((card, i) => {
                card.dataset.suffix = designSuffixes[i];
                updateCardLabel(card);
                updateSVGColors(card.dataset.suffix, card.querySelector('input[type="color"]').value);
            });
            syncUrl();
        }

        // ── Build the color cards ────────────────────────────────
        function createCard(suffix, color) {
            const card = document.createElement('div');
            card.className = 'color-group';
            card.dataset.suffix = suffix;
            card.innerHTML = `
                <label><span class="color-name"></span><span class="floss-code"></span></label>
                <div class="input-row">
                    <input type="color" aria-label="Pick color">
                    <input type="text" aria-label="Hex code" spellcheck="false" autocomplete="off">
                </div>`;

            const picker = card.querySelector('input[type="color"]');
            const textField = card.querySelector('input[type="text"]');

            picker.addEventListener('input', () => {
                setCardColor(card, picker.value);
            });
            picker.addEventListener('change', syncUrl);

            textField.addEventListener('input', () => {
                let color = textField.value.trim();
                if (!color.startsWith('#')) color = '#' + color;
                if (/^#([0-9A-F]{6}|[0-9A-F]{3})$/i.test(color)) {
                    setCardColor(card, chroma(color).hex(), { fromText: true });
                }
            });
            textField.addEventListener('change', syncUrl);
            textField.addEventListener('blur', () => {
                textField.value = picker.value.toUpperCase();
            });

            updateCardLabel(card);
            setCardColor(card, color);
            initDrag(card);
            return card;
        }

        function processSVG() {
            const previewArea = document.getElementById('svgPreview');
            const svgs = previewArea.querySelectorAll('svg');

            if (svgs.length === 0) return;
            controls.innerHTML = '';

            let combinedStyleText = '';
            svgs.forEach(s => {
                s.querySelectorAll('style').forEach(style => combinedStyleText += style.textContent);
            });

            // A color counts only if the design has a style for it AND draws something with it.
            // braceletbook files can define styles for colors the pattern never uses.
            // Alpha patterns also mark empty cells with a color set to "none": not a thread color.
            const styleColor = (suffix) => {
                const main = combinedStyleText.match(new RegExp(`\\.s1-${suffix}\\{stroke:([^};]+)`, 'i'));
                const knot = combinedStyleText.match(new RegExp(`\\.k-${suffix}\\{fill:([^};]+)`, 'i'));
                const match = main || knot;
                return match ? match[1].trim() : null;
            };
            designSuffixes = COLOR_SUFFIXES.filter(suffix => {
                const color = styleColor(suffix);
                const isDrawn = previewArea.querySelector(`.s1-${suffix}, .s-${suffix}, .k-${suffix}, .kk-${suffix}`);
                return color && !/^(none|transparent)$/i.test(color) && isDrawn;
            });

            designSuffixes.forEach((suffix, index) => {
                originalColors[suffix] = convertToHex(styleColor(suffix));
                const activeColor = convertToHex(INCOMING_HEX_CODES[index] || originalColors[suffix]);
                controls.appendChild(createCard(suffix, activeColor));
            });
            lastCommitted = currentHexCodes();
            saveRecent();
        }

        function updateSVGColors(suffix, newColor) {
            document.querySelectorAll('#svgPreview svg').forEach(svg => {
                svg.querySelectorAll('style').forEach(styleTag => {
                    let css = styleTag.textContent;
                    css = css
                        .replace(new RegExp(`(\\.s1-${suffix}\\{stroke:)([^}]+)(\\})`, 'g'), `$1${newColor}$3`)
                        .replace(new RegExp(`(\\.kk-${suffix}\\{fill:)([^}]+)(\\})`, 'g'), `$1${newColor}$3`)
                        .replace(new RegExp(`(\\.k-${suffix}\\{fill:)([^}]+)(\\})`, 'g'), `$1${newColor}$3`)
                        .replace(new RegExp(`(\\.s-${suffix}\\{fill:)([^}]+)(\\})`, 'g'), `$1${newColor}$3`);
                    styleTag.textContent = css;
                });
            });
        }

        function convertToHex(color) {
            const ctx = document.createElement('canvas').getContext('2d');
            ctx.fillStyle = color;
            return ctx.fillStyle;
        }

        // ── Header buttons ───────────────────────────────────────
        document.getElementById('smartPaletteBtn').addEventListener('click', () => {
            const count = getCards().length;
            window.location.href = `${BASE_PATH}/palette?n=${count}&hex_codes=${currentHexCodes()}`;
        });

        // ── Enlarge the bracelet preview ─────────────────────────
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        const previewBar = document.getElementById('previewBar');

        function openLightbox() {
            const svg = previewBar.querySelector('svg');
            if (!svg) return;
            // Snapshot the preview in its current colors as a standalone image
            const text = new XMLSerializer().serializeToString(svg);
            lightboxImg.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(text);
            const box = svg.getBoundingClientRect();
            lightboxImg.classList.toggle('rotate', box.width > box.height * 2);
            lightbox.hidden = false;
            document.getElementById('lightboxClose').focus();
        }

        function closeLightbox() {
            lightbox.hidden = true;
            previewBar.focus();
        }

        if (previewBar) {
            previewBar.addEventListener('click', openLightbox);
            previewBar.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openLightbox(); }
            });
            lightbox.addEventListener('click', closeLightbox);
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && !lightbox.hidden) closeLightbox();
            });
        }

        document.getElementById('undoBtn').addEventListener('click', undo);
        document.getElementById('resetBtn').addEventListener('click', resetColors);
        document.addEventListener('keydown', (e) => {
            const typing = e.target.matches && e.target.matches('input[type="text"]');
            if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'z' && !typing) {
                e.preventDefault();
                undo();
            }
        });

        document.getElementById('copyLinkBtn').addEventListener('click', (e) => {
            const btn = e.currentTarget;
            const url = new URL(editorUrl(), window.location.origin).href;
            syncUrl();
            navigator.clipboard.writeText(url).then(() => {
                btn.textContent = 'Copied!';
            }).catch(() => {
                window.prompt('Copy this link:', url);
            }).finally(() => {
                setTimeout(() => btn.textContent = 'Copy Link', 1500);
            });
        });

        window.onload = processSVG;
    </script>
</body>

</html>
